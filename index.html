<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGC Car Radio — Twitch Diagnostic</title>
<style>
html,body,#player{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
#status{position:fixed;z-index:9999;left:8px;top:8px;max-width:calc(100% - 16px);padding:6px 9px;border-radius:6px;background:rgba(0,0,0,.75);color:#fff;font:12px/1.35 system-ui,sans-serif;pointer-events:none}
</style>
</head><body>
<div id="player"></div><div id="status">AGC Twitch: bridge starting…</div>
<script>
(()=>{
 const params=new URLSearchParams(location.search);
 const channel=(params.get('channel')||'').trim().replace(/^https?:\/\/(?:www\.)?twitch\.tv\//i,'').split(/[/?#]/)[0].replace(/[^A-Za-z0-9_]/g,'');
 const muted=params.get('muted')==='1';
 const status=document.getElementById('status');
 const report=(stage,detail='')=>{
   status.textContent='AGC Twitch: '+stage+(detail?' | '+detail:'');
   try{window.parent.postMessage({source:'agc-twitch-bridge',stage,detail},'*')}catch(_){}
   console.log('[AGC Twitch Bridge]',stage,detail);
 };
 report('BRIDGE_LOADED',location.href);
 if(!channel){report('INVALID_CHANNEL');return}
 const s=document.createElement('script');
 s.src='https://player.twitch.tv/js/embed/v1.js';
 s.async=true;
 s.onerror=()=>report('TWITCH_SCRIPT_LOAD_ERROR',s.src);
 s.onload=()=>{
   report('TWITCH_SCRIPT_LOADED',typeof window.Twitch);
   if(!window.Twitch||!Twitch.Player){report('TWITCH_PLAYER_API_MISSING');return}
   report('TWITCH_PLAYER_CREATE_START',channel);
   let player;
   try{
     player=new Twitch.Player('player',{
       channel,
       parent:['potteh.github.io','cfx-nui-agc-carradio'],
       width:'100%',height:'100%',autoplay:true,muted
     });
     report('TWITCH_PLAYER_CREATED',channel);
   }catch(e){report('TWITCH_PLAYER_CREATE_ERROR',String(e&&e.stack||e));return}
   const on=(ev,name)=>{try{player.addEventListener(ev,()=>report(name,channel))}catch(e){report('EVENT_BIND_ERROR',name+': '+e)}};
   on(Twitch.Player.READY,'TWITCH_READY');
   on(Twitch.Player.PLAY,'TWITCH_PLAY');
   on(Twitch.Player.PLAYING,'TWITCH_PLAYING');
   on(Twitch.Player.PLAYBACK_BLOCKED,'TWITCH_BLOCKED');
   on(Twitch.Player.ONLINE,'TWITCH_ONLINE');
   on(Twitch.Player.OFFLINE,'TWITCH_OFFLINE');
   on(Twitch.Player.ENDED,'TWITCH_ENDED');
   setTimeout(()=>{
     const frames=document.querySelectorAll('#player iframe');
     report('TWITCH_IFRAME_CHECK_5S','iframes='+frames.length+(frames[0]?' src='+frames[0].src:''));
   },5000);
 };
 document.head.appendChild(s);
})();
</script></body></html>

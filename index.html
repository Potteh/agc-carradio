<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AGC Car Radio — Twitch</title>
  <style>
    html,body,#player{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
    #error{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:32px;color:#fff;background:#0b0b0d;font:16px/1.5 system-ui,sans-serif;text-align:center}
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="error">Enter a valid Twitch channel.</div>
  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      let channel = (params.get('channel') || '').trim()
        .replace(/^https?:\/\/(?:www\.)?twitch\.tv\//i, '')
        .split(/[/?#]/)[0]
        .replace(/[^A-Za-z0-9_]/g, '');

      if (!channel) {
        document.getElementById('player').style.display = 'none';
        document.getElementById('error').style.display = 'flex';
        return;
      }

      const muted = params.get('muted') === '1';
      const player = new Twitch.Player('player', {
        channel,
        parent: ['potteh.github.io'],
        width: '100%',
        height: '100%',
        autoplay: true,
        muted
      });

      window.addEventListener('message', (event) => {
        if (!event.data || event.data.source !== 'agc-carradio') return;
        if (event.data.action === 'mute') player.setMuted(true);
        if (event.data.action === 'unmute') player.setMuted(false);
        if (event.data.action === 'setVolume' && Number.isFinite(Number(event.data.volume))) {
          player.setVolume(Math.max(0, Math.min(1, Number(event.data.volume))));
        }
      });
    })();
  </script>
</body>
</html>

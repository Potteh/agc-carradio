<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGC Twitch Bridge Diagnostic</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#0b0b0f;color:#fff;font-family:system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.card{width:min(680px,85%);padding:32px;border:2px solid #9147ff;border-radius:18px;background:#17131f;box-shadow:0 0 40px rgba(145,71,255,.25)}
h1{margin:0 0 12px;font-size:28px}.ok{color:#7dff9b}.small{opacity:.75;margin-top:18px}code{color:#d8c2ff}
</style>
</head>
<body>
<div class="card">
<h1>AGC TWITCH BRIDGE</h1>
<div class="ok">Bridge loaded successfully</div>
<p>Channel: <strong id="channel">unknown</strong></p>
<p>Testing communication with FiveM...</p>
<div class="small">Diagnostic mode — Twitch player intentionally disabled.</div>
</div>
<script>
(() => {
 const params=new URLSearchParams(location.search);
 const channel=(params.get('channel')||'unknown').trim();
 document.getElementById('channel').textContent=channel;
 const report=(stage,detail='')=>{
   try{window.parent.postMessage({source:'agc-twitch-bridge',stage,detail},'*');}catch(e){}
 };
 report('BRIDGE_LOADED',location.href);
 report('DIAGNOSTIC_PAGE_RENDERED',channel);
 setTimeout(()=>report('DIAGNOSTIC_PING_1S',channel),1000);
 setTimeout(()=>report('DIAGNOSTIC_PING_3S',channel),3000);
})();
</script>
</body>
</html>
